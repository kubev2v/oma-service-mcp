# SECURITY: This Route is disabled by default. The MCP server has no built-in
# authentication — it relies on lightspeed-stack (or another auth gateway) to
# authenticate callers and forward bearer tokens.
#
# Exposing the Route without an authenticating proxy in front allows
# unauthenticated access to the Migration Planner API.
#
# To enable external access, deploy behind an OAuth proxy or authentication
# gateway (e.g. oauth2-proxy sidecar). Rate limiting alone is NOT
# authentication — it does not verify caller identity.
#
